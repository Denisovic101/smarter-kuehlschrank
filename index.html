<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Smarter Kühlschrank</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; text-align: center; padding: 20px; }
        #reader { width: 100%; max-width: 500px; margin: auto; }
        #product-info { margin-top: 20px; padding: 15px; border: 1px solid #ddd; display: none; }
    </style>
</head>
<body>
    <h1>🍎 Mein Smarter Kühlschrank</h1>
    <div id="reader"></div>
    
    <div id="product-info">
        <h2 id="p-name">Produktname</h2>
        <p id="p-brand">Marke</p>
        <img id="p-img" src="" style="width: 100px;">
    </div>

    <script>
        // Diese Funktion wird aufgerufen, wenn ein Barcode erkannt wurde
        async function onScanSuccess(decodedText) {
            console.log("Code erkannt: " + decodedText);
            
            // Abfrage der kostenlosen Open Food Facts Datenbank
            const url = `https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.status === 1) {
                    // Produkt gefunden! Infos anzeigen
                    document.getElementById('product-info').style.display = 'block';
                    document.getElementById('p-name').innerText = data.product.product_name || "Unbekanntes Produkt";
                    document.getElementById('p-brand').innerText = data.product.brands || "";
                    document.getElementById('p-img').src = data.product.image_front_url || "";
                } else {
                    alert("Produkt nicht in der Datenbank gefunden.");
                }
            } catch (error) {
                console.error("Fehler bei der API-Abfrage", error);
            }
        }

        let html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 });
        html5QrcodeScanner.render(onScanSuccess);
    </script>
</body>
</html>
