<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smarter Kühlschrank</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #0070f3; --bg: #f0f2f5; --danger: #ff4d4f; --success: #28a745; }
        * { box-sizing: border-box; }
        body { font-family: -apple-system, sans-serif; margin: 0; background: var(--bg); padding-bottom: 80px; color: #333; }
        
        header { background: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        header h2 { margin: 0; font-size: 1.2rem; }
        
        .tab-content { display: none; padding: 15px; animation: fadeIn 0.2s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        
        nav { position: fixed; bottom: 0; width: 100%; background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); display: flex; border-top: 1px solid #ddd; height: calc(65px + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); z-index: 2000; }
        nav button { flex: 1; border: none; background: none; font-size: 10px; color: #888; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: 0.2s; touch-action: manipulation; -webkit-tap-highlight-color: transparent;}
        nav button .icon { font-size: 20px; margin-bottom: 4px; }
        nav button.active-tab { color: var(--primary); font-weight: bold; }

        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-danger { background: white; color: var(--danger); border: 2px solid var(--danger); }
        
        /* Formularelemente (16px verhindert Auto-Zoom bei iOS) */
        input, select { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; font-size: 16px; margin-bottom: 10px; }
        
        .controls-row { display: flex; gap: 10px; margin-bottom: 15px; }
        
        .macro-badge { background: #e0f0ff; color: var(--primary); padding: 3px 6px; border-radius: 6px; font-size: 0.75rem; white-space: nowrap; font-weight: 500;}
        .cat-badge { background: #eee; color: #555; padding: 3px 6px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; display: inline-block; margin-bottom: 5px;}
        
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid var(--primary); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 8px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header><h2 id="title">📋 Inventar</h2></header>

<div id="tab-inventar" class="tab-content active">
    <div class="card" style="padding: 10px 15px;">
        <input type="text" id="search-input" placeholder="🔍 Suchen..." onkeyup="renderInventar()">
        <div class="controls-row" style="margin-bottom: 0;">
            <select id="category-filter" onchange="renderInventar()">
                <option value="Alle">📂 Alle Kategorien</option>
                <option value="Milchprodukte">🧀 Milchprodukte</option>
                <option value="Getränke">🥤 Getränke</option>
                <option value="Fleisch">🥩 Fleisch</option>
                <option value="Obst & Gemüse">🥗 Obst & Gemüse</option>
                <option value="Snacks">🍫 Snacks</option>
                <option value="Sonstiges">📦 Sonstiges</option>
            </select>
            <button class="btn btn-primary" style="width: auto; padding: 10px 15px;" onclick="addManualItem()">+ Neu</button>
        </div>
    </div>

    <div id="liste-leer" class="card" style="text-align:center; color:#666;">Keine Produkte gefunden.</div>
    <div id="inventar-liste"></div>
</div>

<div id="tab-scanner" class="tab-content">
    <div class="card" style="text-align: center;">
        <button id="start-scan-btn" class="btn btn-primary" onclick="startScanner()">📷 Kamera starten</button>
        <button id="stop-scan-btn" class="btn btn-danger" onclick="stopScanner()" style="display:none; margin-bottom:10px;">✖ Kamera abbrechen</button>
        <div id="reader" style="margin-top: 10px; border-radius: 12px; overflow: hidden;"></div>
    </div>
    <div id="scan-result" class="card" style="display:none; border-left: 4px solid var(--primary);">
        <p id="p-name" style="margin:0; font-weight:bold;">Suche Produkt...</p>
    </div>
</div>

<div id="tab-rezepte" class="tab-content">
    <div class="card" style="background:#e8f0fe; border: 1px solid #aecbfa;">
        <label for="api-key" style="font-size:12px; font-weight:bold; color:var(--primary);">Gemini API-Key:</label>
        <input type="password" id="api-key" placeholder="AIzaSy..." style="margin-bottom:0; margin-top:5px;">
        <small style="color:#666; font-size:10px;">Kostenlos unter <i>aistudio.google.com</i> generierbar.</small>
    </div>

    <button onclick="getGeminiRezept()" class="btn btn-primary">✨ KI-Rezept generieren</button>
    <div id="rezept-ausgabe" style="margin-top:15px;"></div>
</div>

<div id="tab-smart" class="tab-content">
    <div class="card">
        <h3>🌡️ Innentemperatur</h3>
        <p id="live-temp" style="font-size: 28px; color: var(--primary); font-weight:bold; margin: 5px 0;">4.2 °C</p>
        <small id="temp-status" style="color: var(--success);">Status: Optimal</small>
    </div>
    <div class="card">
        <h3>🥤 Getränkefüllstand</h3>
        <div style="background: #eee; height: 20px; border-radius: 10px; margin-top: 10px; overflow: hidden;">
            <div id="live-fill-bar" style="background: var(--primary); width: 80%; height: 100%; transition: width 0.5s;"></div>
        </div>
        <p id="live-fill-text" style="margin-top: 5px; font-size: 0.9rem;">Noch ca. 80% vorhanden</p>
    </div>
</div>

<nav id="navbar">
    <button onclick="openTab('inventar', '📋 Inventar', this)" class="active-tab"><span class="icon">📋</span><span>Inventar</span></button>
    <button onclick="openTab('scanner', '📷 Scanner', this)"><span class="icon">📷</span><span>Scanner</span></button>
    <button onclick="openTab('rezepte', '👨‍🍳 Rezepte', this)"><span class="icon">👨‍🍳</span><span>Rezepte</span></button>
    <button onclick="openTab('smart', '🤖 Smart Features', this)"><span class="icon">🤖</span><span>Smart</span></button>
</nav>

<script>
    let inventar = [];
    let isScanning = false;
    let html5QrcodeScanner = null;

    function openTab(tabId, title, btnElement) {
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('#navbar button').forEach(b => b.classList.remove('active-tab'));
        document.getElementById('tab-' + tabId).classList.add('active');
        document.getElementById('title').innerText = title;
        if(btnElement) btnElement.classList.add('active-tab');
    }

    // --- KATEGORIE-LOGIK ---
    function autoCategorize(name) {
        let n = name.toLowerCase();
        if (n.includes('milch') || n.includes('käse') || n.includes('joghurt') || n.includes('butter')) return 'Milchprodukte';
        if (n.includes('wasser') || n.includes('cola') || n.includes('saft') || n.includes('bier') || n.includes('getränk')) return 'Getränke';
        if (n.includes('wurst') || n.includes('fleisch') || n.includes('hähnchen') || n.includes('rind')) return 'Fleisch';
        if (n.includes('apfel') || n.includes('tomate') || n.includes('salat') || n.includes('banane') || n.includes('gemüse')) return 'Obst & Gemüse';
        if (n.includes('schoko') || n.includes('chips') || n.includes('keks') || n.includes('riegel')) return 'Snacks';
        return 'Sonstiges';
    }

    // --- INVENTAR LOGIK ---
    function addManualItem() {
        let name = prompt("Produktname eingeben:");
        if(name && name.trim() !== "") {
            let cat = autoCategorize(name);
            inventar.push({
                id: Date.now().toString(),
                name: name.trim(),
                category: cat,
                bild: "https://via.placeholder.com/60?text=+",
                kalorien: "0.0", protein: "0.0", carbs: "0.0", fat: "0.0",
                qty: 1
            });
            renderInventar();
        }
    }

    function changeQty(index, amount) {
        inventar[index].qty += amount;
        if(inventar[index].qty <= 0) inventar.splice(index, 1);
        renderInventar();
    }

    function deleteItem(index) {
        if(confirm("Produkt wirklich löschen?")) {
            inventar.splice(index, 1);
            renderInventar();
        }
    }

    function renderInventar() {
        const list = document.getElementById('inventar-liste');
        const emptyMsg = document.getElementById('liste-leer');
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        const catFilter = document.getElementById('category-filter').value;
        
        // Filtern nach Suche und Dropdown
        let filtered = inventar.filter(item => {
            let matchesSearch = item.name.toLowerCase().includes(searchTerm);
            let matchesCat = (catFilter === "Alle") || (item.category === catFilter);
            return matchesSearch && matchesCat;
        });
        
        if(filtered.length > 0) {
            emptyMsg.style.display = 'none';
            list.innerHTML = filtered.map((item, originalIndex) => {
                // Find original index in main array for deletion/qty changes
                let realIdx = inventar.findIndex(i => i === item); 
                return `
                <div class="card" style="display: flex; align-items: center; gap: 15px;">
                    <img src="${item.bild}" style="width: 60px; height: 60px; object-fit: contain; border-radius: 8px; border: 1px solid #eee;">
                    <div style="flex: 1; min-width: 0;">
                        <span class="cat-badge">${item.category}</span>
                        <b style="display: block; margin-bottom: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.name}</b>
                        <div style="display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 8px;">
                            <span class="macro-badge">🔥 ${item.kalorien} kcal</span>
                            <span class="macro-badge">🥩 P: ${item.protein}g</span>
                        </div>
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="display:flex; align-items:center; gap:8px;">
                                <button onclick="changeQty(${realIdx}, -1)" style="width:25px; height:25px; border-radius:50%; border:none; background:#ddd; font-weight:bold;">-</button>
                                <span>${item.qty}x</span>
                                <button onclick="changeQty(${realIdx}, 1)" style="width:25px; height:25px; border-radius:50%; border:none; background:#ddd; font-weight:bold;">+</button>
                            </div>
                            <button onclick="deleteItem(${realIdx})" style="background:none; border:none; color:var(--danger); font-size:18px; cursor:pointer;">🗑️</button>
                        </div>
                    </div>
                </div>
            `}).join('');
        } else {
            emptyMsg.style.display = 'block';
            list.innerHTML = '';
        }
    }

    // --- SCANNER LOGIK ---
    function startScanner() {
        if(html5QrcodeScanner) return;
        document.getElementById('start-scan-btn').style.display = 'none';
        document.getElementById('stop-scan-btn').style.display = 'block';
        
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: { width: 250, height: 150 }, rememberLastUsedCamera: true });
        html5QrcodeScanner.render(onScanSuccess, () => {});
    }

    function stopScanner() {
        if(html5QrcodeScanner) {
            html5QrcodeScanner.clear().then(() => {
                html5QrcodeScanner = null;
                document.getElementById('start-scan-btn').style.display = 'block';
                document.getElementById('stop-scan-btn').style.display = 'none';
                document.getElementById('scan-result').style.display = 'none';
            }).catch(e => console.error("Scanner Stop Fehler:", e));
        }
    }

    async function onScanSuccess(decodedText) {
        if (isScanning) return;
        isScanning = true;

        const nameDisplay = document.getElementById('p-name');
        document.getElementById('scan-result').style.display = 'block';
        nameDisplay.innerText = "🔍 Suche Produkt in Datenbank...";

        // Check if already exists
        let existing = inventar.find(i => i.id === decodedText);
        if(existing) {
            existing.qty += 1;
            nameDisplay.innerText = `✅ Wieder erkannt: ${existing.name} (+1)`;
            renderInventar();
        } else {
            try {
                const res = await fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`);
                const data = await res.json();
                
                if(data.status === 1) {
                    const p = data.product;
                    const nutriments = p.nutriments || {};
                    let pName = p.product_name || "Unbekanntes Produkt";
                    
                    const produktObj = {
                        id: decodedText,
                        name: pName,
                        category: autoCategorize(pName),
                        bild: p.image_front_small_url || "https://via.placeholder.com/60?text=+",
                        kalorien: Number(nutriments['energy-kcal_100g'] || 0).toFixed(1),
                        protein: Number(nutriments.proteins_100g || 0).toFixed(1),
                        carbs: Number(nutriments.carbohydrates_100g || 0).toFixed(1),
                        fat: Number(nutriments.fat_100g || 0).toFixed(1),
                        qty: 1
                    };

                    inventar.push(produktObj);
                    nameDisplay.innerText = "✅ " + produktObj.name + " hinzugefügt!";
                    renderInventar();
                } else {
                    nameDisplay.innerText = "❌ Barcode nicht in Datenbank!";
                }
            } catch (e) {
                nameDisplay.innerText = "⚠️ Verbindungsfehler!";
            }
        }
        setTimeout(() => { isScanning = false; }, 2500);
    }

    // --- GEMINI API LOGIK ---
    async function getGeminiRezept() {
        const ausgabe = document.getElementById('rezept-ausgabe');
        const apiKey = document.getElementById('api-key').value.trim();

        if (inventar.length === 0) {
            ausgabe.innerHTML = `<div class="card" style="color:red;">❌ Inventar leer!</div>`;
            return;
        }
        if (!apiKey) {
            ausgabe.innerHTML = `<div class="card" style="color:red;">⚠️ Bitte Gemini API-Key eingeben!</div>`;
            return;
        }

        ausgabe.innerHTML = `<div class="card"><div class="loader"></div> Gemini denkt nach...</div>`;
        
        // Liste für Prompt vorbereiten
        let zutatenListe = inventar.map(i => `${i.qty}x ${i.name}`).join(', ');

        try {
            // Google Gemini 1.5 Flash API Endpunkt
            // ERSETZE SIE HIERMIT:
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key=${apiKey}`;             
            
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{
                        parts: [{
                            text: `Du bist ein Profi-Koch für ein Smarter Kühlschrank Projekt. Ich habe folgende Zutaten: ${zutatenListe}. Erstelle ein kurzes, leckeres Rezept daraus. Du musst nicht zwingend alle Zutaten nutzen. Antworte direkt in HTML (Nutze <h3> für den Titel, <ul> für Zutatenliste, <ol> für die Zubereitungsschritte). Keine Markdown-Codeblöcke wie \`\`\`html, nur das reine HTML.`
                        }]
                    }]
                })
            });

            const data = await response.json();

            if (data.error) {
                ausgabe.innerHTML = `<div class="card" style="color:red;"><b>API Fehler:</b> ${data.error.message}</div>`;
                return;
            }

            // Gemini Output auslesen
            let rezeptHtml = data.candidates[0].content.parts[0].text;
            // Falls Gemini trotzdem Markdown-Tags mitschickt, entfernen wir sie sicherheitshalber
            rezeptHtml = rezeptHtml.replace(/```html/g, '').replace(/```/g, '');
            
            ausgabe.innerHTML = `<div class="card">${rezeptHtml}</div>`;

        } catch (error) {
            ausgabe.innerHTML = `<div class="card" style="color:red;">⚠️ Netzwerkfehler zu Google Gemini.</div>`;
        }
    }

    // --- SMART LIVE DATEN ---
    setInterval(() => {
        let tempElement = document.getElementById('live-temp');
        let statusElement = document.getElementById('temp-status');
        let fillBarElement = document.getElementById('live-fill-bar');
        
        if (tempElement && statusElement && fillBarElement) {
            let temp = (4.0 + (Math.random() * 0.7 - 0.2)).toFixed(1);
            tempElement.innerText = temp + ' °C';
            if(temp > 5.0) {
                statusElement.innerText = "⚠️ Warnung: Zu warm!";
                statusElement.style.color = "var(--danger)";
            } else {
                statusElement.innerText = "Status: Optimal";
                statusElement.style.color = "var(--success)";
            }
            let fillLevel = Math.max(10, Math.floor(80 - (Math.random() * 5)));
            fillBarElement.style.width = fillLevel + '%';
            document.getElementById('live-fill-text').innerText = `Noch ca. ${fillLevel}% vorhanden`;
        }
    }, 4000);

</script>
</body>
</html>
