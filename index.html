<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Smarter Kühlschrank</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root { --primary: #0070f3; --bg: #f0f2f5; --text: #333; --success: #28a745;}
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; background: var(--bg); color: var(--text); padding-bottom: 90px;
        }
        header { background: white; padding: 15px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); position: sticky; top: 0; z-index: 1000; }
        header h2 { margin: 0; font-size: 1.2rem; }
        .tab-content { display: none; padding: 15px; animation: fadeIn 0.3s ease; }
        .active { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
        #reader { width: 100% !important; border: none !important; border-radius: 12px; overflow: hidden; }
        #reader__dashboard_section_swaplink { display: none; }
        
        nav { 
            position: fixed; bottom: 0; left: 0; width: 100%; 
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            display: flex; border-top: 1px solid #ddd; 
            height: calc(65px + env(safe-area-inset-bottom)); 
            padding-bottom: env(safe-area-inset-bottom); z-index: 2000;
        }
        nav button { 
            flex: 1; border: none; background: transparent; font-size: 10px; color: #888; 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: 0.2s; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        }
        nav button .icon { font-size: 20px; margin-bottom: 4px; }
        nav button.active-tab { color: var(--primary); font-weight: bold; }
        
        .btn-action { width: 100%; padding: 15px; border-radius: 12px; background: var(--primary); color: white; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; }
        .item-header { display: flex; justify-content: space-between; align-items: center; font-weight: bold; margin-bottom: 8px;}
        .qty-controls { display: flex; align-items: center; gap: 10px; }
        .qty-btn { background: #eee; border: none; width: 28px; height: 28px; border-radius: 50%; font-weight: bold; cursor: pointer;}
        .macros { display: flex; gap: 8px; font-size: 0.8rem; color: #555; flex-wrap: wrap;}
        .macro-badge { background: #e0f0ff; padding: 3px 8px; border-radius: 8px; color: var(--primary);}
    </style>
</head>
<body>

<header><h2 id="title">📋 Inventar</h2></header>

<div id="tab-inventar" class="tab-content active">
    <div id="liste-leer" class="card" style="text-align: center; color: #999;">Dein Kühlschrank ist noch leer.<br>Gehe zum Scanner, um Produkte hinzuzufügen.</div>
    <div id="inventar-liste"></div>
</div>

<div id="tab-scanner" class="tab-content">
    <div class="card" id="scanner-container">
        <p style="text-align:center; color:#666; margin-top:0;">Kamera auf einen Barcode richten</p>
        <div id="reader"></div>
    </div>
    <div id="scan-result" class="card" style="display:none; border-left: 5px solid var(--primary);">
        <p id="p-name" style="margin:0; font-weight: bold;">Bereit zum Scannen...</p>
    </div>
</div>

<div id="tab-rezepte" class="tab-content">
    <button class="btn-action" onclick="getKIRezept()">✨ Rezept mit KI erstellen</button>
    <div id="rezept-ausgabe" style="margin-top:20px;"></div>
</div>

<div id="tab-smart" class="tab-content">
    <div class="card">
        <h3>🌡️ Kühlraum-Temperatur</h3>
        <p id="live-temp" style="font-size: 28px; color: var(--primary); font-weight: bold; margin: 5px 0;">4.2 °C</p>
        <small id="temp-status" style="color: var(--success);">Status: Optimal</small>
    </div>
    <div class="card">
        <h3>🥤 Getränke-Füllstand</h3>
        <div style="background: #eee; height: 20px; border-radius: 10px; margin-top: 10px; overflow: hidden;">
            <div id="live-fill-bar" style="background: var(--primary); width: 80%; height: 100%; transition: width 0.5s;"></div>
        </div>
        <p id="live-fill-text" style="margin-top: 5px; font-size: 0.9rem;">Noch ca. 80% vorhanden</p>
    </div>
</div>

<nav id="navbar">
    <button onclick="openTab('inventar', '📋 Inventar', this)" class="active-tab"><span class="icon">📋</span><span>Inventar</span></button>
    <button onclick="openTab('scanner', '📷 Scanner', this)"><span class="icon">📷</span><span>Scanner</span></button>
    <button onclick="openTab('rezepte', '👨‍🍳 Rezepte', this)"><span class="icon">👨‍🍳</span><span>Rezepte</span></button>
    <button onclick="openTab('smart', '🤖 Smart Features', this)"><span class="icon">🤖</span><span>Smart</span></button>
</nav>

<script>
    let inventar = []; 
    let isScanning = false;
    let html5QrcodeScanner = null;

    function openTab(tabId, title, btnElement) {
        try {
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            document.querySelectorAll('#navbar button').forEach(btn => btn.classList.remove('active-tab'));
            
            document.getElementById('tab-' + tabId).classList.add('active');
            document.getElementById('title').innerText = title;
            btnElement.classList.add('active-tab');

            if (tabId === 'scanner' && !html5QrcodeScanner) {
                if (typeof Html5QrcodeScanner !== 'undefined') {
                    startScanner();
                } else {
                    console.warn("Scanner nicht geladen.");
                    document.getElementById('reader').innerHTML = "<p style='color:red;'>Scanner konnte nicht geladen werden.</p>";
                }
            }
        } catch (error) {
            console.error("Fehler beim Tab-Wechsel:", error);
        }
    }

    function updateQty(id, change) {
        let item = inventar.find(i => i.id === id);
        if (item) {
            item.qty += change;
            if (item.qty <= 0) inventar = inventar.filter(i => i.id !== id);
            renderInventar();
        }
    }

    function renderInventar() {
        const listContainer = document.getElementById('inventar-liste');
        const emptyMsg = document.getElementById('liste-leer');
        
        if (inventar.length > 0) {
            emptyMsg.style.display = 'none';
            listContainer.innerHTML = inventar.map(item => `
                <div class="card">
                    <div class="item-header">
                        <span style="max-width: 65%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${item.name}</span>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty('${item.id}', -1)">-</button>
                            <span>${item.qty}x</span>
                            <button class="qty-btn" onclick="updateQty('${item.id}', 1)">+</button>
                        </div>
                    </div>
                    <div class="macros">
                        <span class="macro-badge">🔥 ${item.kcal} kcal</span>
                        <span class="macro-badge">🥩 ${item.protein}g Prot</span>
                        <span class="macro-badge">🥖 ${item.carbs}g Kohlenh.</span>
                        <span class="macro-badge">🧈 ${item.fat}g Fett</span>
                    </div>
                </div>
            `).join('');
        } else {
            emptyMsg.style.display = 'block';
            listContainer.innerHTML = '';
        }
    }

    function startScanner() {
        html5QrcodeScanner = new Html5QrcodeScanner("reader", { 
            fps: 10, qrbox: { width: 250, height: 150 }, rememberLastUsedCamera: true
        });
        html5QrcodeScanner.render(onScanSuccess);
    }

    async function onScanSuccess(decodedText) {
        if (isScanning) return;
        isScanning = true;
        const resultDiv = document.getElementById('scan-result');
        const nameDisplay = document.getElementById('p-name');
        resultDiv.style.display = 'block';
        nameDisplay.innerText = "🔍 Suche Produktdatenbank...";

        let existingItem = inventar.find(i => i.id === decodedText);
        if (existingItem) {
            existingItem.qty += 1;
            nameDisplay.innerText = `✅ Wieder erkannt: ${existingItem.name} (+1)`;
            renderInventar();
        } else {
            try {
                const response = await fetch(`https://world.openfoodfacts.org/api/v0/product/${decodedText}.json`);
                const data = await response.json();
                if (data.status === 1) {
                    const nutriments = data.product.nutriments || {};
                    const newItem = {
                        id: decodedText,
                        name: data.product.product_name || "Unbekanntes Produkt",
                        qty: 1,
                        kcal: nutriments['energy-kcal_100g'] || 0,
                        protein: nutriments['proteins_100g'] || 0,
                        carbs: nutriments['carbohydrates_100g'] || 0,
                        fat: nutriments['fat_100g'] || 0
                    };
                    inventar.push(newItem);
                    nameDisplay.innerText = "✅ Neu hinzugefügt: " + newItem.name;
                    renderInventar();
                } else {
                    nameDisplay.innerText = "❌ Unbekannter Barcode (" + decodedText + ")";
                }
            } catch (error) {
                nameDisplay.innerText = "⚠️ Verbindungsfehler!";
            }
        }
        setTimeout(() => { isScanning = false; }, 3000);
    }

    function getKIRezept() {
        const ausgabe = document.getElementById('rezept-ausgabe');
        if (inventar.length === 0) {
            ausgabe.innerHTML = `<div class="card" style="color:red;">❌ Dein Kühlschrank ist leer. Bitte scanne zuerst Zutaten!</div>`;
            return;
        }
        const zutatenNamen = inventar.map(i => i.name).join(', ');
        ausgabe.innerHTML = `
            <div class="card" style="border: 2px solid var(--primary);">
                <h4 style="margin-top:0;">👨‍🍳 KI-Vorschlag wird generiert...</h4>
                <p>Analysiere Zutaten: <i>${zutatenNamen}</i></p>
            </div>
        `;
        setTimeout(() => {
            ausgabe.innerHTML = `
                <div class="card" style="border: 2px solid var(--primary);">
                    <h3 style="margin-top:0;">🍽️ Kreative Kühlschrank-Pfanne</h3>
                    <p><b>Benötigte Zutaten aus deinem Inventar:</b> ${zutatenNamen}</p>
                    <p><b>Anleitung:</b></p>
                    <ol style="padding-left: 20px;">
                        <li>Alle Zutaten in mundgerechte Stücke schneiden.</li>
                        <li>Etwas Öl in einer Pfanne erhitzen.</li>
                        <li>Die Zutaten nach und nach anbraten, bis sie goldbraun sind.</li>
                        <li>Mit Salz, Pfeffer und Kräutern nach Belieben abschmecken.</li>
                    </ol>
                </div>
            `;
        }, 1500);
    }

    setInterval(() => {
        let tempElement = document.getElementById('live-temp');
        let statusElement = document.getElementById('temp-status');
        let fillBarElement = document.getElementById('live-fill-bar');
        let fillTextElement = document.getElementById('live-fill-text');
        
        if (tempElement && statusElement && fillBarElement && fillTextElement) {
            let temp = (4.0 + (Math.random() * 0.7 - 0.2)).toFixed(1);
            tempElement.innerText = temp + ' °C';
            if(temp > 5.0) {
                statusElement.innerText = "⚠️ Warnung: Zu warm!";
                statusElement.style.color = "red";
            } else {
                statusElement.innerText = "Status: Optimal";
                statusElement.style.color = "var(--success)";
            }
            let fillLevel = Math.max(10, Math.floor(80 - (Math.random() * 5)));
            fillBarElement.style.width = fillLevel + '%';
            fillTextElement.innerText = `Noch ca. ${fillLevel}% vorhanden`;
        }
    }, 4000);
</script>
</body>
</html>
